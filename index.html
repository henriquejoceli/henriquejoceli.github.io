<!DOCTYPE html>
<html lang="pt-BR" data-theme="gruvbox">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Portfólio de Henrique Bravi Joceli da Silva — Desenvolvedor Back-end em formação. Projetos, certificações e stacks em um terminal interativo.">
  <title>Portfólio — Henrique B Joceli</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
  <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

  <main class="main">

    <div class="container-terminal-history">

      <div class="container-start">
        <p data-translate="start">visitor@portfolio:~$ inicio</p>
      </div>

      <div class="container-intro">
        <p data-translate="introduction">
          Olá, seja bem vindo(a) ao meu portfólio.
        </p>
      </div>

      <div class="container-list">
        <p data-translate="availableCommands">Comandos disponíveis:</p>
        <ul class="commands-list">
          <li class="commands-menu" data-translate="aboutMe">sobre mim</li>
          <li class="commands-menu" data-translate="contact">contato</li>
          <li class="commands-menu" data-translate="projects">projetos</li>
          <li class="commands-menu" data-translate="certifications">certificações</li>
          <li class="commands-menu" data-translate="stacks">tecnologias</li>
          <li class="commands-menu" data-translate="themeChange">alterar tema</li>
          <li class="commands-menu" data-translate="languageChange">alterar idioma</li>
          <li class="commands-menu" data-translate="help">ajuda</li>
          <li class="commands-menu" data-translate="clear">limpar</li>
        </ul>
      </div>

    </div>

    <div class="container-form-input">
      <form id="visitor-input" action="" method="post">
        <fieldset>
          <label for="command-input">visitor@portfolio:~$ </label>
          <input type="text" id="command-input" autocomplete="off" spellcheck="false" autofocus>
        </fieldset>
      </form>
    </div>

  </main>

  <script src="assets/js/main.js"></script>

</body>

</html>
